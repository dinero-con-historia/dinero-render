name: DINERO render
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID del video (carpeta jobs/<id>)"
        required: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JOB_ID: ${{ inputs.job_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: Instalar ffmpeg y fuentes
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-inter
          mkdir -p ~/.fonts
          curl -sL -o ~/.fonts/Poppins-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf || true
          curl -sL -o ~/.fonts/Poppins-Medium.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Medium.ttf || true
          curl -sL -o ~/.fonts/Outfit.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/outfit/Outfit%5Bwght%5D.ttf" || true
          curl -sL -o ~/.fonts/BarlowCondensed-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/barlowcondensed/BarlowCondensed-Bold.ttf || true
          curl -sL -o ~/.fonts/Poppins-ExtraBold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-ExtraBold.ttf || true
          curl -sL -o ~/.fonts/Poppins-SemiBold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-SemiBold.ttf || true
          curl -sL -o ~/.fonts/PatrickHand-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/patrickhand/PatrickHand-Regular.ttf || true
          fc-cache -f || true
          ls -la ~/.fonts
      - name: Renderizar video
        run: |
          pip install --quiet --break-system-packages pillow numpy edge-tts || pip install --quiet pillow numpy edge-tts || true
          if [ -f motion_pack.tgz ]; then tar xzf motion_pack.tgz; fi
          if grep -q '"remotion_tsx"' "jobs/${JOB_ID}/job.json"; then
            if python3 render_remotion.py "jobs/${JOB_ID}/job.json" "video-${JOB_ID}.mp4"; then
              echo "Render Remotion OK"
            else
              echo "::warning::Remotion fallo; se usa el motor anterior (director)"
              python3 render_motion.py "jobs/${JOB_ID}/job.json" "video-${JOB_ID}.mp4"
            fi
          elif grep -Eq '"(plantilla|motor)"' "jobs/${JOB_ID}/job.json"; then
            python3 render_motion.py "jobs/${JOB_ID}/job.json" "video-${JOB_ID}.mp4"
          else
            python3 render_dinero_edge.py "jobs/${JOB_ID}/job.json" "video-${JOB_ID}.mp4"
          fi
      - name: Publicar video en Release
        run: gh release create "v-${JOB_ID}" "video-${JOB_ID}.mp4" --title "video-${JOB_ID}" --notes "DINERO"
      - name: Limpiar paquete del repositorio
        run: |
          git config user.name "variado-bot"
          git config user.email "variado-bot@users.noreply.github.com"
          git rm -r -f -q "jobs/${JOB_ID}"
          git commit -m "limpiar jobs/${JOB_ID}"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -q origin main && git push -q; then break; fi
            sleep $((RANDOM % 8 + 3))
          done
