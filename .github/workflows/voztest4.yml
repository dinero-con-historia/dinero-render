name: voztest4
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: instalar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install edge-tts
      - name: generar
        run: |
          python3 - <<'PY'
          import asyncio, subprocess, edge_tts
          T = ['Sabias que tu cuerpo tiene mas bacterias que celulas humanas?', 'Suena imposible, pero los cientificos lo midieron en dos mil dieciseis.', 'Y aqui viene lo mejor: casi todas te ayudan a digerir, a defenderte y hasta a pensar mejor.', 'Enviaselo a alguien que todavia no lo sabia.']
          async def tts(t, p):
              await edge_tts.Communicate(t, 'es-MX-JorgeNeural', rate='+20%', pitch='+0Hz').save(p)
          def build(tag, label, sd, ss, gap):
              ws = []
              for i, t in enumerate(T):
                  asyncio.run(tts(t, 'r%d.mp3' % i))
                  w = '%s%d.wav' % (tag, i)
                  af = 'silenceremove=start_periods=1:start_threshold=-45dB:stop_periods=-1:stop_duration=%s:stop_threshold=-45dB:stop_silence=%s,apad=pad_dur=%s,aresample=44100' % (sd, ss, gap)
                  subprocess.run(['ffmpeg', '-y', '-loglevel', 'error', '-i', 'r%d.mp3' % i, '-af', af, '-ac', '1', w], check=True)
                  ws.append(w)
              open(tag + '.txt', 'w').write(''.join('file %s' % w + chr(10) for w in ws))
              subprocess.run(['ffmpeg', '-y', '-loglevel', 'error', '-f', 'concat', '-safe', '0', '-i', tag + '.txt', '-c:a', 'libmp3lame', '-q:a', '2', tag + '.mp3'], check=True)
              vf = "drawtext=text='%s':fontcolor=white:fontsize=70:x=(w-tw)/2:y=(h-th)/2" % label
              subprocess.run(['ffmpeg', '-y', '-loglevel', 'error', '-f', 'lavfi', '-i', 'color=c=black:s=540x960:r=15', '-i', tag + '.mp3', '-vf', vf, '-shortest', '-c:v', 'libx264', '-pix_fmt', 'yuv420p', '-c:a', 'aac', tag + '.mp4'], check=True)
          build('actual', 'Actual', '0.2', '0.06', '0.08')
          build('fluida', 'Fluida', '0.08', '0.02', '0.03')
          PY
          ls -la
      - name: publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v-voztest4 actual.mp4 fluida.mp4 -t voztest4 -n prueba --repo ${{ github.repository }}

